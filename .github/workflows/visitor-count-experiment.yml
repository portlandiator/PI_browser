name: Visitor count experiment (temporary)
# Measures how GitHub counts the downloads of release files, with throwaway
# files in two throwaway releases that the last job deletes again. Each probe
# runs on its own machine, so each has its own network address. This file is
# removed from the branch when the experiment has been read.
on:
  push:
    branches: [claude/nifty-faraday-wo2kk1]
    paths: ['.github/workflows/visitor-count-experiment.yml']
permissions:
  contents: write
env:
  A: https://github.com/${{ github.repository }}/releases/download/visitor-count-test-a
  B: https://github.com/${{ github.repository }}/releases/download/visitor-count-test-b
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create two throwaway releases with one-pixel files
        run: |
          printf 'R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7' | base64 -d > pixel.gif
          for name in plain twice two-first two-second releases-first no-follow browser-like later agents chrome firefox; do cp pixel.gif "$name.gif"; done
          mkdir other && cp pixel.gif other/releases-second.gif
          rm pixel.gif
          gh release create visitor-count-test-a ./*.gif --title 'Visitor count experiment A (temporary)' --notes 'Temporary: deleted when the experiment ends.' --latest=false
          gh release create visitor-count-test-b other/*.gif --title 'Visitor count experiment B (temporary)' --notes 'Temporary: deleted when the experiment ends.' --latest=false
          date -u +'created %T'
  plain:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code} %{num_redirects} redirects\n' "$A/plain.gif"
  twice:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The same file twice from one address
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$A/twice.gif"
          sleep 5
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$A/twice.gif"
  two-files:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Two files of one release from one address
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$A/two-first.gif"
          sleep 5
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$A/two-second.gif"
  two-releases:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Files of two releases from one address
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$A/releases-first.gif"
          sleep 5
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$B/releases-second.gif"
  no-follow:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only the first request, without fetching the file itself
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sS -o /dev/null -w '%{http_code}\n' "$A/no-follow.gif"
  browser-like:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The headers a browser sends from another site
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' -H 'Accept: */*' -H 'Sec-Fetch-Site: cross-site' -H 'Sec-Fetch-Mode: no-cors' -H 'Sec-Fetch-Dest: empty' "$A/browser-like.gif"
  agents:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One file from one address by two different browsers
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' "$A/agents.gif"
          sleep 5
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:144.0) Gecko/20100101 Firefox/144.0' "$A/agents.gif"
  later:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: The same file from one address again after twelve minutes
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$A/later.gif"
          sleep 720
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          date -u +%T; curl -sSL -o /dev/null -w '%{http_code}\n' "$A/later.gif"
  browsers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: The page's own request from a real browser
        run: |
          echo "address $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          cat > probe.mjs <<'EOF'
          // Serves a page that asks for the file exactly as the site does, then reports what the browser said.
          import http from 'node:http';
          const url=process.argv[2];
          const page=`<!doctype html><meta charset="utf-8"><title>probe</title><script>
          const started=performance.now();
          fetch(${JSON.stringify(url)},{mode:'no-cors',credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store',keepalive:true})
            .then(response=>'resolved '+response.type,error=>'rejected '+error.message)
            .then(outcome=>fetch('/report?outcome='+encodeURIComponent(outcome+' after '+Math.round(performance.now()-started)+' ms; '+navigator.userAgent)));
          </script>`;
          const server=http.createServer((request,response)=>{
            if(request.url.startsWith('/report')){
              console.log(new Date().toISOString().slice(11,19),decodeURIComponent(request.url.split('outcome=')[1]||''));
              response.end('ok');setTimeout(()=>process.exit(0),300);return;
            }
            response.writeHead(200,{'content-type':'text/html'});response.end(page);
          });
          server.listen(8123,'127.0.0.1');
          setTimeout(()=>{console.log('no report within 70 s');process.exit(0);},70000);
          EOF
          node probe.mjs "$A/${{ matrix.browser }}.gif" &
          sleep 2
          date -u +%T
          if [ '${{ matrix.browser }}' = chrome ]; then
            google-chrome --version
            timeout 50 google-chrome --headless=new --no-sandbox --disable-gpu --user-data-dir="$(mktemp -d)" --user-agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' http://127.0.0.1:8123/ >/dev/null 2>&1 || true
          else
            firefox --version
            timeout 50 firefox --headless --no-remote --profile "$(mktemp -d)" http://127.0.0.1:8123/ >/dev/null 2>&1 || true
          fi
          wait
  report:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Read the counts every three minutes
        run: |
          for round in $(seq 1 17); do
            echo "$(date -u +%T) A: $(gh api "repos/$GH_REPO/releases/tags/visitor-count-test-a" --jq '[.assets[]|"\(.name|rtrimstr(".gif"))=\(.download_count)"]|join(" ")') | B: $(gh api "repos/$GH_REPO/releases/tags/visitor-count-test-b" --jq '[.assets[]|"\(.name|rtrimstr(".gif"))=\(.download_count)"]|join(" ")')"
            sleep 180
          done
      - name: Delete the throwaway releases and their tags
        if: always()
        run: |
          gh release delete visitor-count-test-a --cleanup-tag --yes || true
          gh release delete visitor-count-test-b --cleanup-tag --yes || true
          echo "releases left: $(gh release list --json tagName --jq '[.[].tagName]|join(" ")')"
