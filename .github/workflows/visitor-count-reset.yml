name: Visitor count reset (temporary)
# Clears the test requests made while the feature was checked against GitHub:
# this week's four counting files are deleted and added again, so that their
# counts start at zero. The release notes still show zero for the week. This
# file is removed from the branch once it has run.
on:
  push:
    branches: [claude/nifty-faraday-wo2kk1]
    paths: ['.github/workflows/visitor-count-reset.yml']
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/visitor-counts.mjs
            src/visitor-count.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete this week's files, which hold only test requests
        run: |
          week=$(node -e "import('./src/visitor-count.mjs').then(module=>console.log(module.weekOf(new Date())))")
          echo "week $week; before: $(gh release view visitor-counts --json assets --jq '[.assets[]|select(.downloadCount>0)|"\(.name)=\(.downloadCount)"]|join(" ")')"
          grep -c 'so far) | 0 | 0 | 0 | 0 |' <(gh release view visitor-counts --json body --jq .body)
          for page in catalog volumes subjects study-guides; do
            gh release delete-asset visitor-counts "$page-$week.gif" --yes
            sleep 1
          done
      - name: Add them again
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/visitor-counts.mjs
      - name: Show the result
        run: |
          echo "files: $(gh release view visitor-counts --json assets --jq '.assets|length'); counted: $(gh release view visitor-counts --json assets --jq '[.assets[]|select(.downloadCount>0)|"\(.name)=\(.downloadCount)"]|join(" ")')"
          gh release view visitor-counts --json body --jq .body | tail -4
