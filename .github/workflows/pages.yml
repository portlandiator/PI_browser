name: Build and deploy Partial Inventory browser
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'subject-summaries/**'
      - 'study-guides/**'
      - 'subject_extracts/**'
      - 'pdf_volumes - copy/**'
      - '*.csv'
      - 'subjects - reference.docx'
      - 'package.json'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Ignore cached data and rebuild the complete collection
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GENERATED_PATHS: |
        dist/collections
        dist/pdf-volumes
        dist/build-state.json
        dist/stats.json
        dist/volumes.json
        dist/volume-titles.json
        dist/subject-match-state.json.gz
        build-report.json
        subject-import-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pull request check uploads the site it built and tested, named after
      # its content. A merge that leaves main with exactly that content is
      # published from it, without building everything a second time.
      - name: Look for the build verified by the pull request check
        id: verified
        if: ${{ !inputs.force_rebuild }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verified-build.mjs find >> "$GITHUB_OUTPUT"
      - name: Download the verified build
        if: steps.verified.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.verified.outputs.name }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Add the volume PDFs to the verified build
        if: steps.verified.outputs.run_id != ''
        run: node scripts/build-volumes.mjs
      - name: Test parser and search semantics
        run: node --test tests/core.test.mjs tests/subjects.test.mjs
      - name: Verify source publication policy
        run: |
          python -m unittest discover -s tests -p test_archive_sources.py
          python -m unittest discover -s tests -p test_patch_item.py
          python -m unittest discover -s tests -p test_describe_collection.py
          python scripts/archive-sources.py --check
      - name: Fingerprint source data and build dependencies
        id: inputs
        run: node scripts/deployment-cache.mjs key >> "$GITHUB_OUTPUT"
      - name: Restore unchanged generated collection and PDFs
        id: generated
        if: ${{ !inputs.force_rebuild && steps.verified.outputs.run_id == '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GENERATED_PATHS }}
          key: pages-data-v3-${{ runner.os }}-${{ steps.inputs.outputs.key }}
          # Any earlier collection will do: the build reuses each record, search
          # shard and subject match that is still valid and rebuilds the rest.
          restore-keys: |
            pages-data-v3-${{ runner.os }}-
      - name: Extract source archive for validation of cached data
        if: steps.generated.outputs.cache-hit == 'true' || steps.verified.outputs.run_id != ''
        run: for shard in data/collection/*.tar; do tar -xf "$shard"; done
      - name: Build the changed records, search index and subjects
        if: steps.generated.outputs.cache-hit != 'true' && steps.verified.outputs.run_id == ''
        run: PI_INCREMENTAL=${{ inputs.force_rebuild && '0' || '1' }} node --max-old-space-size=6144 scripts/build.mjs
      # The build above already applies the interface and builds the study guides.
      - name: Apply current interface to generated collection
        if: steps.generated.outputs.cache-hit == 'true'
        run: node --max-old-space-size=6144 scripts/deployment-cache.mjs refresh
      - name: Prepare public files and retain separate audit records
        run: node scripts/prepare-pages.mjs
      - name: Verify generated collection
        run: node --test tests/*.test.mjs
      - name: Keep only the verified active dataset in the deployment
        run: node scripts/deployment-cache.mjs prune
      - name: Publish volume PDFs to the separate PDF site when they change
        env:
          PDF_SITE_TOKEN: ${{ secrets.PDF_SITE_TOKEN }}
        run: node scripts/publish-pdf-site.mjs
      - name: Cache successfully verified collection and PDFs
        if: steps.generated.outputs.cache-hit != 'true' && !inputs.force_rebuild
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GENERATED_PATHS }}
          key: pages-data-v3-${{ runner.os }}-${{ steps.inputs.outputs.key }}
      - name: Preserve publication audit independently of the hosted site
        uses: actions/upload-artifact@v4
        with:
          name: publication-audit-${{ github.sha }}
          path: publication-audit/
          retention-days: 90
          if-no-files-found: error
      - name: Summarize deployment path
        env:
          CACHE_HIT: ${{ steps.generated.outputs.cache-hit }}
          VERIFIED_RUN: ${{ steps.verified.outputs.run_id }}
        run: |
          if [ -n "$VERIFIED_RUN" ]; then
            echo "Published the build verified by pull request check run $VERIFIED_RUN; all tests passed again here." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CACHE_HIT" = "true" ]; then
            echo 'Reused verified collection and PDFs; refreshed interface; all tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rebuilt the changed records, subject matches and study guides (the complete collection when no earlier one could be reused). All tests passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'GitHub Pages still requires one complete site artifact per deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # The site is close to 1 GB; when GitHub Pages syncs slowly the
        # default 10-minute wait is too short (two timeouts on 2026-11-10).
        with:
          timeout: 1800000
